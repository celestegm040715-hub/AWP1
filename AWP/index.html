<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWP - Celeste Gómez Mendoza</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f4f7fb;
      color: #222;
      padding: 40px;
      text-align: center;
    }
    h1 { color: #0b5cff; margin-bottom:5px; }
    h2 { color: #555; margin-top:0; font-weight:400; }

    .container {
      background: #fff;
      padding: 25px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: 40px auto;
      text-align: center;
    }

    .folder, .back {
      display: block;
      margin: 10px auto;
      padding: 12px 20px;
      border-radius: 6px;
      color: #fff;
      text-decoration: none;
      width: 200px;
      transition: 0.2s;
      cursor: pointer;
    }
    .folder { background-color: #0b5cff; }
    .folder:hover { background-color: #0637a6; }
    .back { background-color: #777; }
    .back:hover { background-color: #555; }

    .hidden { display: none; }

  </style>
</head>
<body>

  <h1>Celeste Gómez Mendoza</h1>
  <h2>Matrícula: 22307046</h2>

  <div class="container">
    <!-- Vista AWP -->
    <div id="awp" class="view">
      <h3>Directorio raíz: AWP</h3>
      <div class="folder" onclick="showView('u1')">📁 U1</div>
    </div>

    <div id="u1" class="view hidden">
        <h3>Subcarpeta: U1</h3>
        
        <!-- Botón que te lleva a SW -->
        <a href="SW/index.html" class="folder">📁 SW</a>
        
        <!-- Botón que te lleva a SW2 -->
        <a href="SW2/index.html" class="folder">📁 SW2</a>
        
      </div>
      
  <footer style="margin-top:30px; color:#777;">&copy; 2025 - Estructura de directorios simulada en un solo HTML</footer>

  <script>
    function showView(id){
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }
  </script>

</body>
</html>
